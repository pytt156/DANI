services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dani-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mlflow:
    build:
      context: ./backend
    container_name: dani-mlflow

    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "mlflow:5000,localhost:*,127.0.0.1:*"

    volumes:
      - mlflow_data:/mlflow

    ports:
      - "127.0.0.1:5000:5000"

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)" ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s

    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: dani-backend

    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LOG_JSON: "true"

      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: dani_knowledge

      CORS_ORIGINS: '["http://localhost:5173","https://daniela.algerydh.com"]'

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}

      PREMIUM_ACCESS_KEY_HASHES: ${PREMIUM_ACCESS_KEY_HASHES:-}

      MLFLOW_ENABLED: ${MLFLOW_ENABLED:-true}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-dani}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      qdrant:
        condition: service_started
      mlflow:
        condition: service_healthy

    restart: unless-stopped

volumes:
  qdrant_data:
  mlflow_data:
