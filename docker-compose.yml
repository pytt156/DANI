services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dani-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend

    container_name: dani-backend

    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LOG_JSON: "true"

      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: dani_knowledge

      RETRIEVAL_SCORE_THRESHOLD: ${RETRIEVAL_SCORE_THRESHOLD:-0.30}

      CORS_ORIGINS: '["http://localhost:5173","https://daniela.algerydh.com"]'

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-45}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-0}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}

      PREMIUM_ACCESS_KEY_HASHES: ${PREMIUM_ACCESS_KEY_HASHES:-}

      MLFLOW_ENABLED: ${MLFLOW_ENABLED:-false}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://127.0.0.1:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-dani}

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      - qdrant

    restart: unless-stopped

  ingest:
    build:
      context: ./backend

    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: dani_knowledge

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

    volumes:
      - ./knowledge:/knowledge:ro

    depends_on:
      - qdrant

    command: [ "python", "-m", "dani_api.rag.ingest" ]

    profiles:
      - tools

    restart: "no"

volumes:
  qdrant_data:
