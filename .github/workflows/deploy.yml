name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::334419247691:role/GitHubActions-DANI-Deploy
          aws-region: eu-north-1

      - name: Deploy via SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04c75d24d81397ce9" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DANI from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/DANI",
              "sudo -u ubuntu git fetch origin",
              "sudo -u ubuntu git checkout main",
              "sudo -u ubuntu git pull --ff-only origin main",
              "docker compose up -d --build",
              "docker compose ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04c75d24d81397ce9"

      - name: Show deploy result
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-04c75d24d81397ce9"