name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::334419247691:role/GitHubActions-DANI-Deploy
          aws-region: eu-north-1

      - name: Deploy via SSM
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids "i-04c75d24d81397ce9" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DANI from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/DANI",
              "sudo -u ubuntu git fetch origin",
              "sudo -u ubuntu git checkout main",
              "sudo -u ubuntu git pull --ff-only origin main",
              "docker compose up -d --build",
              "docker compose ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            STATUS=$(aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "i-04c75d24d81397ce9" \
              --query "Status" \
              --output text)

            echo "SSM status: $STATUS ($attempt/$MAX_ATTEMPTS)"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with SSM status: $STATUS"
                exit 1
                ;;
            esac

            sleep "$SLEEP_SECONDS"
          done

          echo "Deployment did not finish within $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds."
          exit 1

      - name: Show deploy result
        if: always() && steps.deploy.outputs.command_id != ''
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-04c75d24d81397ce9"